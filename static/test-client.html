<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <title>Interview Analysis — Test Client</title>
   <style>
      :root {
         --bg: #12151a;
         --panel: #1b1f27;
         --border: #2a2f3a;
         --text: #e6e9ef;
         --muted: #8b93a1;
         --ok: #3ecf8e;
         --warn: #e0a63e;
         --bad: #e05a5a;
         --accent: #4f8ff7;
      }

      * {
         box-sizing: border-box;
      }

      body {
         margin: 0;
         background: var(--bg);
         color: var(--text);
         font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
         padding: 24px;
      }

      h1 {
         font-size: 18px;
         margin: 0 0 4px;
      }

      .sub {
         color: var(--muted);
         font-size: 13px;
         margin-bottom: 20px;
      }

      .grid {
         display: grid;
         grid-template-columns: 320px 1fr;
         gap: 20px;
         align-items: start;
      }

      .panel {
         background: var(--panel);
         border: 1px solid var(--border);
         border-radius: 8px;
         padding: 16px;
      }

      .panel h2 {
         font-size: 13px;
         text-transform: uppercase;
         letter-spacing: 0.04em;
         color: var(--muted);
         margin: 20px 0 12px;
      }

      .panel h2:first-child {
         margin-top: 0;
      }

      video {
         width: 100%;
         border-radius: 6px;
         background: #000;
         display: block;
      }

      label {
         display: block;
         font-size: 12px;
         color: var(--muted);
         margin: 10px 0 4px;
      }

      .radio-label {
         display: block;
         font-size: 13px;
         color: var(--text);
         margin: 6px 0;
         cursor: pointer;
      }

      .radio-label input {
         margin-right: 6px;
      }

      input[type="text"],
      input[type="file"] {
         width: 100%;
         padding: 8px;
         background: #0f1216;
         border: 1px solid var(--border);
         border-radius: 5px;
         color: var(--text);
         font-size: 13px;
      }

      button {
         padding: 9px 14px;
         border-radius: 6px;
         border: 1px solid var(--border);
         background: #232834;
         color: var(--text);
         font-size: 13px;
         cursor: pointer;
         margin-right: 8px;
         margin-top: 10px;
      }

      button:hover {
         background: #2b3140;
      }

      button.primary {
         background: var(--accent);
         border-color: var(--accent);
         color: #08111f;
         font-weight: 600;
      }

      button.primary:hover {
         background: #6ba0ff;
      }

      button:disabled {
         opacity: 0.4;
         cursor: not-allowed;
      }

      hr.divider {
         border: none;
         border-top: 1px solid var(--border);
         margin: 20px 0;
      }

      .status-row {
         display: flex;
         gap: 8px;
         align-items: center;
         margin-top: 12px;
         font-size: 12px;
      }

      .dot {
         width: 8px;
         height: 8px;
         border-radius: 50%;
         background: var(--muted);
      }

      .dot.connected {
         background: var(--ok);
      }

      .dot.error {
         background: var(--bad);
      }

      .score-block {
         display: flex;
         align-items: baseline;
         gap: 8px;
         margin: 6px 0;
      }

      .score-num {
         font-size: 28px;
         font-weight: 700;
      }

      .score-label {
         font-size: 12px;
         color: var(--muted);
         text-transform: uppercase;
         letter-spacing: 0.03em;
      }

      .badge {
         display: inline-block;
         padding: 2px 8px;
         border-radius: 4px;
         font-size: 11px;
         font-weight: 600;
         text-transform: uppercase;
      }

      .badge.correct { background: rgba(62,207,142,0.15); color: var(--ok); }
      .badge.incorrect { background: rgba(224,90,90,0.15); color: var(--bad); }
      .badge.partially_correct { background: rgba(224,166,62,0.15); color: var(--warn); }
      .badge.not_confirmed { background: rgba(139,147,161,0.15); color: var(--muted); }
      
      .log {
         height: 440px;
         overflow-y: auto;
         font-size: 13px;
         line-height: 1.5;
      }

      .entry {
         border-bottom: 1px solid var(--border);
         padding: 10px 0;
      }

      .entry:last-child {
         border-bottom: none;
      }

      .entry .transcript {
         color: var(--text);
         margin: 4px 0;
      }

      .entry .meta {
         color: var(--muted);
         font-size: 12px;
      }

      .entry .followup {
         margin-top: 6px;
         padding: 8px 10px;
         background: rgba(79, 143, 247, 0.08);
         border-left: 3px solid var(--accent);
         border-radius: 4px;
         font-size: 13px;
      }

      .entry .question-detected {
         color: var(--accent);
         font-size: 13px;
      }

      .hint {
         color: var(--muted);
         font-size: 12px;
         margin-top: 4px;
      }
   </style>
</head>

<body>

   <h1>Interview Analysis — Test Client</h1>
   <!-- <div class="sub">Local debug page for the facial + audio pipeline. Questions and answers are auto-detected — nothing
      to type.</div> -->
   <div class="sub"></div>

   <div class="grid">

      <!-- LEFT COLUMN -->
      <div class="panel">

         <input type="hidden" id="serverUrl" value="127.0.0.1:8000">
         <input type="hidden" id="sessionId" value="test123">
      
         <hr class="divider">

         <h2>Live Interview (webcam + mic)</h2>
         <video id="preview" autoplay muted playsinline></video>

         <button id="startBtn" class="primary">Start Interview</button>
         <button id="stopBtn" disabled>Stop</button>

         <div class="status-row"><span class="dot" id="audioDot"></span> Audio WS</div>
         <div class="status-row"><span class="dot" id="videoDot"></span> Video WS</div>

         <hr class="divider">

         <h2>Offline Test — Video Source</h2>

         <label class="radio-label">
            <input type="radio" name="videoSource" value="upload" checked> Upload file
         </label>
         <label class="radio-label">
            <input type="radio" name="videoSource" value="url"> Video URL (YouTube, etc.)
         </label>

         <div id="uploadBlock">
            <label for="videoFile">Interview recording (mp4/webm)</label>
            <input type="file" id="videoFile" accept="video/*">
         </div>

         <div id="urlBlock" style="display:none;">
            <label for="videoUrl">Video URL</label>
            <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
         </div>

         <button id="evaluateVideoBtn">Evaluate Video</button>
         <div class="hint" id="videoEvalStatus"></div>

      </div>

      <!-- RIGHT COLUMN -->
      <div class="panel">
         <h2>Live Facial Signal</h2>
      <div class="score-block">
         <div class="score-label" id="facialLabel" style="font-size:20px; text-transform:none;">no data</div>
      </div>
         <h2 style="margin-top:24px;">Answer Evaluations</h2>
         <div class="log" id="log">
            <div class="hint">Waiting for the first detected question or answer...</div>
         </div>
      </div>

   </div>

   <script src="interview_client.js"></script>

</body>

</html>
